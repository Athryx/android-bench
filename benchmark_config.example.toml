name = "challenge-6.1-eval"
num_instances = 4
harness = "codex"
internet_enabled = true
summarize = true
max_reprompts = 2

# Challenges can be specified as a list of strings:
# challenges = ["element", "shareit", "vlc"]
#
# Or as an array of tables with per-challenge configurations:
# [[challenges]]
# name = "element"
# capabilities = ["code_execution", "file_write"]
# solutions_folder = "seeds/element"   # Copied to /data/solution instead of generating default template
# extra_prompt = "Focus on exported activities and intent filters."
#
# [[challenges]]
# name = "vlc"


[limits]
token_limit = 500000
turn_limit = 50
time_limit = 3600.0
dollar_limit = 10.0

[model_config]
model = "gpt-6-astra"
model_effort = "xhigh"
temperature = 0.2
max_tokens = 65536
top_p = 0.95
timeout_seconds = 3600
thinking_budget = 32768
